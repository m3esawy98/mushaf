<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المصحف">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>المصحف الشريف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7; --card:#fffdf8; --ink:#2a2418; --muted:#7b705c; --line:#e6dccb;
    --accent:#1f5f4a; --accent-soft:#e3eee8; --gold:#b08a3e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif}
  button,input{font:inherit;color:inherit}
  .hidden{display:none!important}

  /* ---------- Home ---------- */
  #home{max-width:720px;margin:0 auto;padding:20px 16px 40px}
  .brand{text-align:center;padding:18px 0 8px}
  .brand h1{font-family:"Amiri",serif;font-size:40px;margin:0;color:var(--accent);font-weight:700}
  .brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .continue{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 18px;width:100%;
    margin:16px 0 8px;cursor:pointer;text-align:right}
  .continue small{display:block;opacity:.85;font-size:13px}
  .continue b{font-size:17px}
  .continue .arrow{font-size:22px}
  .controls{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
  .tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .hizbcard{padding:10px 12px 12px}
  .tabs button small{display:inline-grid;place-items:center;min-width:2em;height:2em;padding:0 .35em;margin-inline-start:12px;border-radius:999px;
    background:#f1ebe0;color:var(--ink);font-size:.85em;font-weight:700;line-height:1;vertical-align:middle}
  .tabs button[aria-selected="true"] small{background:#c8ddd1;color:var(--accent)}
  .tabs button{min-width:0}
  @media (max-width:520px){
    .tabs button{font-size:clamp(12px,3.5vw,15px)!important;padding:8px 2px!important;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2}
    .tabs button small{margin-inline-start:0;font-size:.8em;min-width:1.9em;height:1.7em}
  }
  .rg{grid-column:span 2;min-width:0;border:1px solid var(--line);border-radius:12px;padding:6px;background:#faf6ee}
  .rglabel{font-size:12.5px;font-weight:700;color:var(--gold);text-align:center;margin-bottom:5px}
  .rgcells{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .hizbpair{display:flex;gap:8px;padding:0 12px 12px}
  .hizb{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:center;line-height:1.35}
  .hizb:hover{border-color:var(--gold)}
  .hizb span{display:block;font-weight:700;color:var(--accent);font-size:15px}
  .hizb small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hlabel small{color:var(--muted);font-weight:400;font-size:13px}
  .tabs button{flex:1;border:0;background:transparent;padding:10px 4px;white-space:nowrap;border-radius:9px;cursor:pointer;font-weight:500;font-size:16px;color:var(--muted)}
  .tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .search{margin-top:10px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;outline:none}
  .search:focus{border-color:var(--accent)}
  .list{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr;gap:8px}
  @media (min-width:640px){.list{grid-template-columns:1fr 1fr}}
  .item{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;cursor:pointer;text-align:right}
  .item:hover{border-color:var(--gold)}
  .num{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
  .item .name{flex:1;min-width:0}
  .item .name b{display:block;font-family:"Amiri",serif;font-size:21px;font-weight:700;line-height:1.3}
  .item .name small{color:var(--muted);font-size:13px}
  .item .pg{flex:none;color:var(--muted);font-size:13px;text-align:left}
  .item .pg b{display:block;color:var(--ink);font-size:16px}
  .juzcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .juzcard .item{border:0;border-radius:0}
  .hizbs{display:flex;flex-direction:column;gap:10px;padding:0 12px 12px}
  .hlabel{font-weight:700;color:var(--gold);font-size:14px;margin:0 2px 6px}
  .rubs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .rub{min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 2px;cursor:pointer;text-align:center;line-height:1.3}
  .rub:hover{border-color:var(--gold)}
  .rub span{display:block;font-weight:700;color:var(--accent);font-size:clamp(11px,3.2vw,13.5px);white-space:nowrap}
  .rub small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  .extras{display:flex;gap:8px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}

  /* ---------- Reader ---------- */
  #reader{position:fixed;inset:0;background:#efe8da;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,253,248,.96);
    border-bottom:1px solid var(--line);transition:transform .2s, opacity .2s;z-index:3}
  .bar.bottom{border-bottom:0;border-top:1px solid var(--line);justify-content:center}
  .iconbtn{border:0;background:transparent;width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:22px;display:grid;place-items:center}
  .iconbtn:hover{background:var(--accent-soft)}
  .iconbtn:disabled{opacity:.3;cursor:default;background:transparent}
  .title{flex:1;min-width:0;text-align:center;line-height:1.2}
  .title b{font-family:"Amiri",serif;font-size:21px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title small{color:var(--muted);font-size:13px}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y pinch-zoom;position:relative}
  .stage img{max-width:100%;max-height:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;
    box-shadow:0 2px 14px rgba(0,0,0,.12);background:#fffdf5}
  .stage .loading{position:absolute;color:var(--muted)}
  .stage img.pending{visibility:hidden}
  .pagehit{grid-column:1/-1}
  .pagehit .item{border-color:var(--gold);background:#fffaf0}
  .goto{display:flex;align-items:center;gap:6px;margin:0 6px}
  .goto input{width:76px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
  .goto span{color:var(--muted);font-size:14px}
  #reader.immersive .bar.top{transform:translateY(-100%);opacity:0;position:absolute;left:0;right:0;top:0}
  #reader.immersive .bar.bottom{transform:translateY(100%);opacity:0;position:absolute;left:0;right:0;bottom:0}
  .navzone{position:absolute;top:0;bottom:0;width:22%;z-index:2;cursor:pointer}
  .navzone.left{left:0}.navzone.right{right:0}
  @media (hover:none){.navzone{display:none}}
  #reader.zoomed .stage{display:block;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
  #reader.zoomed .stage img{max-width:none;max-height:none;width:min(100%,1441px);margin:0 auto}
  @media (min-width:900px){#reader.zoomed .stage img{width:min(90%,1441px)}}
  #reader.zoomed .navzone{display:none}
  #zoomBtn{font-size:19px}
  .offline{margin:6px auto 4px;max-width:520px;text-align:center}
  .offline .extras{margin-top:0}
  .offline .chip{font-size:14.5px;padding:10px 16px}
  .offline .chip.done{background:var(--accent-soft);color:var(--accent);border-color:transparent;cursor:default}
  .offline .chip.install{background:var(--accent);color:#fff;border-color:transparent}
  .prog{margin-top:10px}
  .prog .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .prog small,.offline .note{display:block;color:var(--muted);font-size:13px;margin-top:6px}
</style>
</head>
<body>

<main id="home">
  <div class="brand">
    <h1>المصحف الشريف</h1>
    <p>اختر سورة أو جزءًا لفتح صفحته</p>
  </div>
  <div class="offline hidden" id="offline">
    <div class="extras">
      <button class="chip install hidden" id="installBtn">📲 ثبّت التطبيق على الجهاز</button>
      <button class="chip" id="dlBtn">⬇ احفظ المصحف للقراءة بدون إنترنت</button>
    </div>
    <div class="prog hidden" id="dlProg"><div class="bar"><i id="dlBar"></i></div><small id="dlTxt"></small></div>
    <small class="note hidden" id="iosNote">للتثبيت على الآيفون: من Safari دوس زرار المشاركة ثم «إضافة إلى الشاشة الرئيسية»</small>
  </div>
  <button class="continue hidden" id="continueBtn">
    <span><small>متابعة القراءة</small><b id="continueLabel"></b></span>
    <span class="arrow">←</span>
  </button>
  <div class="controls">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="surahs">السور<small>١١٤</small></button>
      <button role="tab" aria-selected="false" data-tab="juz">الأجزاء<small>٣٠</small></button>
      <button role="tab" aria-selected="false" data-tab="hizb">الأحزاب<small>٦٠</small></button>
      <button role="tab" aria-selected="false" data-tab="rub">الأرباع<small>٢٤٠</small></button>
      <button role="tab" aria-selected="false" data-tab="thumun">الأثمان<small>٤٨٠</small></button>
    </div>
    <input class="search" id="search" type="search" placeholder="ابحث باسم السورة أو رقمها…" autocomplete="off">
  </div>
  <ul class="list" id="list"></ul>
  <div class="extras">
    <button class="chip" data-page="605">دعاء ختم القرآن</button>
    <button class="chip" data-page="607">فهرس السور</button>
  </div>
</main>

<section id="reader" class="hidden" aria-label="قارئ المصحف">
  <div class="bar top">
    <button class="iconbtn" id="backBtn" title="رجوع للفهرس" aria-label="رجوع للفهرس">→</button>
    <div class="title"><b id="rSurah"></b><small id="rMeta"></small></div>
    <button class="iconbtn" id="zoomBtn" title="تكبير" aria-label="تكبير الصفحة">🔍</button>
  </div>
  <div class="stage" id="stage">
    <span class="loading" id="loading">جارٍ التحميل…</span>
    <img id="pageImg" alt="">
    <div class="navzone left" id="zoneLeft" title="الصفحة التالية"></div>
    <div class="navzone right" id="zoneRight" title="الصفحة السابقة"></div>
  </div>
  <div class="bar bottom">
    <button class="iconbtn" id="prevBtn" title="الصفحة السابقة" aria-label="الصفحة السابقة"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <form class="goto" id="gotoForm">
      <span>صفحة</span><input id="gotoInput" type="number" inputmode="numeric" min="1" max="608"><span id="totalLbl"></span>
    </form>
    <button class="iconbtn" id="nextBtn" title="الصفحة التالية" aria-label="الصفحة التالية"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  </div>
</section>

/* ---------- Reader ---------- */
const home = document.getElementById("home"), reader = document.getElementById("reader");
const img = document.getElementById("pageImg"), loading = document.getElementById("loading");
const gotoInput = document.getElementById("gotoInput");
document.getElementById("totalLbl").textContent = "من " + ar(TOTAL);
let current = 1;
// الصفحات محفوظة في ملفات، كل ملف فيه 4 صفحات: [عدد][أطوال][بيانات الصور]
const PER = 4;
const bundles = new Map();
function getBundle(k){
  if(!bundles.has(k)){
    const pr = fetch(`hq/${k}.webp`).then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(buf=>{
      const dv = new DataView(buf), n = dv.getUint32(0,true);
      let off = 4 + 4*n; const urls = [];
      for(let i=0;i<n;i++){ const len=dv.getUint32(4+4*i,true);
        urls.push(URL.createObjectURL(new Blob([buf.slice(off,off+len)],{type:"image/webp"}))); off+=len; }
      return urls;
    }).catch(e=>{ bundles.delete(k); throw e; });
    bundles.set(k, pr);
  }
  return bundles.get(k);
}
const pageUrl = p => getBundle(Math.floor((p-1)/PER)).then(u=>u[(p-1)%PER]);
function preload(p){ if(p>=1 && p<=TOTAL) getBundle(Math.floor((p-1)/PER)).catch(()=>{}); }

function openPage(p){
  p = Math.max(1, Math.min(TOTAL, p|0));
  if(location.hash !== "#page-"+p) location.hash = "page-"+p;
  else show(p);
}

function show(p){
  current = p;
  home.classList.add("hidden"); reader.classList.remove("hidden");
  loading.classList.remove("hidden");
  loading.textContent = "جارٍ التحميل…";
  img.classList.add("pending");
  img.onload = ()=>{ loading.classList.add("hidden"); img.classList.remove("pending"); };
  pageUrl(p).then(u=>{ if(current===p){ img.src = u; stage.scrollTop = 0; } })
    .catch(()=>{ if(current===p) loading.textContent = "تعذّر تحميل الصفحة — حاول مرة أخرى"; });
  img.alt = "صفحة " + p;
  if(p<=QURAN_PAGES){
    document.getElementById("rSurah").textContent = "سورة " + SURAHS[surahAt(p)][0];
    const r = rubAt(p), k = r%4, h = ar(Math.floor(r/4)+1);
    document.getElementById("rMeta").textContent = `الجزء ${ORDINALS[juzAt(p)]} · الحزب ${h} · ${RUB_SHORT[k]} · صفحة ${ar(p)}`;
  } else {
    document.getElementById("rSurah").textContent = p<=606 ? "دعاء ختم القرآن" : "فهرس السور";
    document.getElementById("rMeta").textContent = `صفحة ${ar(p)}`;
  }
  gotoInput.value = p;
  document.getElementById("prevBtn").disabled = p<=1;
  document.getElementById("nextBtn").disabled = p>=TOTAL;
  store.set(p);
  preload(p+PER); preload(p-1);
}

function showHome(){
  reader.classList.add("hidden"); home.classList.remove("hidden");
  refreshContinue();
}

const next = ()=>{ if(current<TOTAL) openPage(current+1); };
const prev = ()=>{ if(current>1) openPage(current-1); };

document.getElementById("nextBtn").onclick = next;
document.getElementById("prevBtn").onclick = prev;
document.getElementById("zoneLeft").onclick = next;   // الكتاب العربي: اليسار = الصفحة التالية
document.getElementById("zoneRight").onclick = prev;
const zoomBtn = document.getElementById("zoomBtn");
function setZoom(on){
  reader.classList.toggle("zoomed", on);
  zoomBtn.title = on ? "ملاءمة الشاشة" : "تكبير";
  zoomBtn.style.background = on ? "var(--accent-soft)" : "";
  stage.scrollTop = 0;
}
zoomBtn.onclick = ()=>setZoom(!reader.classList.contains("zoomed"));
img.addEventListener("dblclick", ()=>setZoom(!reader.classList.contains("zoomed")));
document.getElementById("backBtn").onclick = ()=>{ location.hash = ""; };
document.getElementById("gotoForm").addEventListener("submit", e=>{
  e.preventDefault(); const v=parseInt(gotoInput.value,10); if(v) openPage(v); gotoInput.blur();
});

document.addEventListener("keydown", e=>{
  if(reader.classList.contains("hidden") || e.target===gotoInput) return;
  if(e.key==="ArrowLeft") next();
  else if(e.key==="ArrowRight") prev();
  else if(e.key==="Escape") location.hash="";
});

// السحب: من اليسار لليمين = الصفحة التالية (زي تقليب المصحف)
const stage = document.getElementById("stage");
let sx=0, sy=0, st=0, touches=0;
stage.addEventListener("touchstart", e=>{ touches=e.touches.length; sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now(); }, {passive:true});
stage.addEventListener("touchend", e=>{
  if(touches>1) return;
  const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){ dx>0 ? next() : prev(); }
  else if(Math.abs(dx)<10 && Math.abs(dy)<10 && Date.now()-st<300){ reader.classList.toggle("immersive"); }
}, {passive:true});

function route(){
  const m = location.hash.match(/^#page-(\d+)$/);
  if(m) show(Math.max(1, Math.min(TOTAL, parseInt(m[1],10))));
  else showHome();
}
window.addEventListener("hashchange", route);
render(); route();

/* ---------- PWA: التثبيت والقراءة بدون إنترنت ---------- */
(function(){
  if(!("serviceWorker" in navigator) || !("caches" in window)) return;
  const PAGES_CACHE = "mushaf-pages-v2", NB = Math.ceil(TOTAL/PER);
  const box = document.getElementById("offline"), dlBtn = document.getElementById("dlBtn");
  const prog = document.getElementById("dlProg"), bar = document.getElementById("dlBar"), txt = document.getElementById("dlTxt");
  const installBtn = document.getElementById("installBtn"), iosNote = document.getElementById("iosNote");
  const urlOf = k => new URL(`hq/${k}.webp`, location.href).href;
  let busy = false;

  async function saved(){
    const c = await caches.open(PAGES_CACHE); let n = 0;
    for(let k=0;k<NB;k++) if(await c.match(urlOf(k))) n++;
    return n;
  }
  async function refresh(){
    if(busy) return;
    const n = await saved();
    if(n>=NB){ dlBtn.textContent = "✓ المصحف محفوظ على الجهاز — يفتح بدون إنترنت"; dlBtn.classList.add("done"); dlBtn.disabled = true; }
    else if(n>0){ dlBtn.textContent = `⬇ كمّل حفظ المصحف (${ar(Math.round(n/NB*100))}٪ محفوظ)`; }
  }
  async function download(){
    if(busy) return; busy = true; dlBtn.disabled = true;
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
    const c = await caches.open(PAGES_CACHE);
    prog.classList.remove("hidden");
    let done = 0, failed = 0, next = 0;
    const inflight = new Map(); let bytes = 0, raf = 0;
    const paint = () => { raf = 0; let f = done; inflight.forEach(v => f += v);
      const pct = Math.min(100, f/NB*100);
      bar.style.width = Math.max(pct, 1) + "%";
      txt.textContent = `جارٍ الحفظ… ${ar(Math.floor(pct))}٪ — ${ar(Math.round(bytes/1e6))} ميجا`; };
    const show = () => { if(!raf) raf = requestAnimationFrame(paint); };
    show();
    async function worker(){
      while(next < NB){
        const k = next++, u = urlOf(k);
        try{
          if(!(await c.match(u))){
            const r = await fetch(u, {cache:"no-store"}); if(!r.ok) throw 0;
            const len = +r.headers.get("content-length") || 0;
            if(r.body && r.body.getReader){
              const rd = r.body.getReader(), chunks = []; let got = 0;
              for(;;){ const {done:end, value} = await rd.read(); if(end) break;
                chunks.push(value); got += value.length; bytes += value.length;
                if(len) inflight.set(k, Math.min(got/len, .99)); show(); }
              await c.put(u, new Response(new Blob(chunks, {type:"image/webp"}), {headers:{"Content-Type":"image/webp"}}));
            } else { await c.put(u, r); }
          }
          inflight.delete(k);
        }catch(e){ failed++; inflight.delete(k); }
        done++; show();
      }
    }
    await Promise.all([worker(),worker(),worker(),worker()]);
    busy = false; dlBtn.disabled = false;
    if(failed){ txt.textContent = `اتحفظ ${ar(NB-failed)} من ${ar(NB)} — اتأكد من النت ودوس تاني عشان تكمّل`; }
    else { prog.classList.add("hidden"); }
    refresh();
  }
  dlBtn.addEventListener("click", download);

  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; installBtn.classList.remove("hidden"); });
  installBtn.addEventListener("click", async () => { if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; installBtn.classList.add("hidden"); });
  window.addEventListener("appinstalled", () => installBtn.classList.add("hidden"));
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) iosNote.classList.remove("hidden");

  navigator.serviceWorker.register("sw.js").then(() => { box.classList.remove("hidden"); refresh(); }).catch(()=>{});
})();
</script>
